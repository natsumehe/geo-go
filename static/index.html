<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostGIS 空间高频调度中枢大屏</title>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0b1522; font-family: "Helvetica Neue", Arial, sans-serif; }
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        .control-panel { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(11, 21, 34, 0.85); border: 1px solid #1e3a5f; padding: 15px; border-radius: 6px; color: #fff; width: 280px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); backdrop-filter: blur(5px); }
        h3 { margin: 0 0 10px 0; font-size: 16px; color: #00d2ff; letter-spacing: 1px; border-bottom: 1px solid #1e3a5f; padding-bottom: 5px; }
        .device-select { width: 100%; background: #112233; border: 1px solid #224466; color: #fff; padding: 8px; border-radius: 4px; outline: none; cursor: pointer; }
        .alarm-container { position: absolute; top: 20px; right: 20px; z-index: 10; background: rgba(11, 21, 34, 0.85); border: 1px solid #ff3b30; padding: 15px; border-radius: 6px; color: #fff; width: 320px; max-height: 400px; overflow-y: auto; box-shadow: 0 4px 20px rgba(255,0,0,0.15); backdrop-filter: blur(5px); }
        .alarm-item { background: rgba(255, 59, 48, 0.1); border-left: 4px solid #ff3b30; padding: 8px 12px; margin-bottom: 8px; border-radius: 0 4px 4px 0; font-size: 13px; animation: fadeIn 0.3s ease-out; }
        .alarm-time { color: #8e8e93; float: right; font-size: 11px; margin-top: 2px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="control-panel">
        <h3>🛰️ 活跃采集终端发现</h3>
        <select id="deviceList" class="device-select" onchange="switchDeviceHistory(this.value)">
            <option value="">-- 选择设备查看历史轨迹 --</option>
        </select>
    </div>

    <div class="alarm-container">
        <h3 style="color: #ff3b30; border-bottom: 1px solid #551a1a;">🚨 空间越界碰撞实时存证</h3>
        <div id="alarmLog"></div>
    </div>

    <script src="static/js/app.js"></script>
</body>
</html>
