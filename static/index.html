<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Geo-Go 高精度车辆监控与地理围栏系统</title>
    <link href="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #111; }
        #map { width: 100%; height: 100%; position: absolute; top: 0; bottom: 0; }
        
        /* 科技感大屏幕监控面板 */
        #panel {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(20, 20, 20, 0.9); padding: 15px;
            border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 300px; border: 1px solid #333; color: #fff;
        }
        h3 { margin-top: 0; color: #00d2ff; border-bottom: 2px solid #007cbf; padding-bottom: 5px; font-size: 16px; }
        #status { font-size: 12px; color: #aaa; margin-bottom: 10px; }
        #device-info { font-size: 11px; color: #2ecc71; font-family: monospace; margin-bottom: 8px; }
        
        /* 车辆选择列表容器 */
        #device-swiper { 
            max-height: 120px; overflow-y: auto; margin-bottom: 10px; 
            border: 1px solid #222; padding: 4px; background: rgba(0,0,0,0.3);
        }
        .swiper-slide { 
            padding: 8px; background: #1a1a1a; margin-top: 4px; border-radius: 4px; 
            font-size: 12px; cursor: pointer; border-left: 3px solid #555; transition: all 0.2s;
        }
        .swiper-slide:hover { background: #222; }
        .swiper-slide.active { background: #007cbf; color: white; font-weight: bold; border-left: 3px solid #00d2ff; }
        .slide-tag { font-size: 10px; color: #888; }
        
        /* 报警历史区域 */
        #alarm-logs { max-height: 150px; overflow-y: auto; margin-top: 10px; border-top: 1px solid #333; padding-top: 8px; }
        .log-item { font-size: 11px; margin-bottom: 6px; padding: 6px; background: rgba(255, 51, 51, 0.1); border-left: 3px solid #ff3333; border-radius: 2px; color: #ff9999; }
    </style>
</head>
<body>

<div id="panel">
    <h3>Geo-Go 指挥中心</h3>
    <div id="device-info">DEVICE ID: FETCHING...</div>
    <div id="status">系统初始化中...</div>
    
    <div style="margin-top: 10px; font-weight: bold; font-size: 12px; color: #00d2ff; margin-bottom: 4px;">🚗 活跃车辆列表 (点击锁定追踪)</div>
    <div id="device-swiper"></div>

    <div style="font-weight: bold; font-size: 12px; color: #ff3333;">🚨 实时区域报警存证</div>
    <div id="alarm-logs"></div>
</div>

<div id="map"></div>

<script src="/app.js"></script>
</body>
</html>
