<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo-Go 高精度车辆监控与地理围栏系统</title>
    <link href="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #0d0f12; }
        #map { width: 100%; height: 100%; position: absolute; top: 0; bottom: 0; }
        
        /* 科技感大屏幕监控面板 */
        #panel {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(13, 15, 18, 0.9); padding: 15px;
            border-radius: 8px; box-shadow: 0 4px 25px rgba(0,0,0,0.8);
            width: 300px; border: 1px solid #1f2937; color: #fff;
            max-height: calc(100vh - 60px); display: flex; flex-direction: column;
        }
        h3 { margin-top: 0; color: #00d2ff; border-bottom: 2px solid #007cbf; padding-bottom: 5px; font-size: 16px; margin-bottom: 10px; }
        #status { font-size: 12px; color: #9ca3af; margin-bottom: 10px; line-height: 1.4; }
        #device-info { font-size: 11px; color: #00FF88; font-family: monospace; margin-bottom: 12px; font-weight: bold; }
        
        /* 车辆选择列表容器 */
        #device-swiper { 
            max-height: 150px; overflow-y: auto; margin-bottom: 15px; 
            border: 1px solid #1f2937; padding: 4px; background: rgba(0,0,0,0.4);
            border-radius: 4px;
        }
        .swiper-slide { 
            padding: 8px; background: #15181e; margin-top: 4px; border-radius: 4px; 
            font-size: 12px; cursor: pointer; border-left: 3px solid #374151; transition: all 0.2s ease;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; /* 防止超长 ID 撑破面板 */
        }
        .swiper-slide:first-child { margin-top: 0; }
        .swiper-slide:hover { background: #1f2937; border-left-color: #9ca3af; }
        .swiper-slide.active { background: #007cbf; color: white; font-weight: bold; border-left: 3px solid #00d2ff; }
        .slide-tag { font-size: 10px; color: #9ca3af; margin-bottom: 2px; }
        
        /* 报警历史区域 */
        #alarm-logs { 
            max-height: 200px; overflow-y: auto; margin-top: 10px; 
            border-top: 1px solid #1f2937; padding-top: 10px;
        }
        .log-item { 
            font-size: 11px; margin-bottom: 6px; padding: 6px; 
            background: rgba(255, 51, 51, 0.08); border-left: 3px solid #ff3333; 
            border-radius: 4px; color: #ff9999; line-height: 1.5;
        }

        /* 🎯 优化：自定义大屏幕科技感滚动条，规避原生粗糙滚动条 */
        #device-swiper::-webkit-scrollbar,
        #alarm-logs::-webkit-scrollbar {
            width: 4px;
        }
        #device-swiper::-webkit-scrollbar-track,
        #alarm-logs::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        #device-swiper::-webkit-scrollbar-thumb,
        #alarm-logs::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 2px;
        }
        #device-swiper::-webkit-scrollbar-thumb:hover,
        #alarm-logs::-webkit-scrollbar-thumb:hover {
            background: #007cbf;
        }
    </style>
</head>
<body>

<div id="panel">
    <h3>Geo-Go 指挥中心</h3>
    <div id="device-info">DEVICE ID: FETCHING...</div>
    <div id="status">系统初始化中...</div>
    
    <div style="font-weight: bold; font-size: 12px; color: #00d2ff; margin-bottom: 6px;">🚗 活跃车辆列表 (点击锁定追踪)</div>
    <div id="device-swiper"></div>

    <div style="font-weight: bold; font-size: 12px; color: #ff3333; margin-bottom: 2px;">🚨 实时区域报警存证</div>
    <div id="alarm-logs"></div>
</div>

<div id="map"></div>

<script src="/js/app.js"></script>
</body>
</html>
