version: '3.8'

services:
  app:
    build: .
    container_name: geo-go-app-1
    ports:
      - "443:443"
      - "8080:8080"
    environment:
      # 🎯 穿透宿主机访问外部 PostGIS 数据库
      - DB_URL=postgres://docker:floder123@host.docker.internal:5432/gis_db?sslmode=disable
      # 🎯 修正：显式声明 Redis 连接串（请确保 Go 代码中解析该变量时支持 host:port 格式）
      - REDIS_URL=geo-go-redis-1:6379
    restart: always
    depends_on:
      - redis
      - valhalla-service
    volumes:
      # 【物理挂载】宿主机 SSL 证书绝对路径只读穿透（完美解决 open /ssl/cert.pem 报错）
      - /ssl:/ssl:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:7-alpine
    container_name: geo-go-redis-1
    restart: always
    # 💡 提示：无需暴露 6379 给外网，Compose 内部局域网默认互通，更安全

  valhalla-service:
    image: ghcr.io/valhalla/valhalla:latest
    container_name: valhalla-service
    restart: always
    ports:
      - "8002:8002"
    volumes:
      # 🎯 将宿主机的配置文件挂载到容器默认读取位置
      - /root/valhalla-server/valhalla.json:/custom_files/valhalla.json:ro
      # 🎯 将解构好的上海路网拓扑碎文件目录挂载进容器
      - /root/valhalla-server/custom_tiles:/custom_files/valhalla_tiles
    # 💡 避坑指南：不强行覆写 entrypoint，让官方镜像用自带的轻量脚本高内聚启动，最稳妥