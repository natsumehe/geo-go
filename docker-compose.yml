version: '3.8'

services:
  app:
    build: .
    container_name: geo-go-app-1
    ports:
      - "443:443"
      - "8080:8080"
    environment:
      # 🎯 优化：利用 extra_hosts 引入宿主机别名，防止 172.17.0.1 漂移导致连不上 DB
      - DB_URL=postgres://docker:floder123@host.docker.internal:5432/gis_db?sslmode=disable
      - REDIS_URL=redis:6379
    restart: always
    depends_on:
      - redis
      - valhalla-service
    volumes:
      # 【物理挂载】SSL 真证书绝对路径穿透
      - /ssl:/ssl:ro
    extra_hosts:
      - "host.docker.internal:host-gateway" # 允许 Linux 容器通过该域名直接穿透访问宿主机服务

  redis:
    image: redis:7-alpine
    container_name: geo-go-redis-1
    restart: always

  valhalla-service:
    image: ghcr.io/valhalla/valhalla:latest
    container_name: valhalla-service
    restart: always
    ports:
      - "8002:8002"
    # 🎯 提醒：请检查 valhalla.json 内部的路径配置是否与挂载点完全一致
    entrypoint: ["valhalla_service", "/etc/valhalla/valhalla.json", "1"]
    volumes:
      - /root/valhalla-server/valhalla.json:/etc/valhalla/valhalla.json:ro
      # 🎯 假设你的 JSON 里的 tile_dir 配置为 "/custom_tiles"，此处保持一致。
      # 如果遇到了权限问题（Permission Denied），可尝试在宿主机执行: chmod -R 777 /root/valhalla-server/custom_tiles
      - /root/valhalla-server/custom_tiles:/custom_tiles