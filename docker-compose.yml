version: '3.8'

services:
  # -------------------------------------------------------------
  # 🚀 Go 后端网关总线服务
  # -------------------------------------------------------------
  app:
    build: .
    container_name: geo-go-app-1
    restart: always
    # 🎯 核心改变：直接共享宿主机网络，全面卸载自定义虚拟网卡
    network_mode: host  
    environment:
      # 💡 由于处于同一主机网络，DB_URL 穿透不再需要 host.docker.internal 别名
      - DB_URL=postgres://docker:floder123@127.0.0.1:5432/gis_db?sslmode=disable
      # 💡 访问隔壁的 Redis 直接走本地环回网卡
      - REDIS_URL=127.0.0.1:6379
    volumes:
      - /ssl:/ssl:ro                 
      - ./static:/app/static         

  # -------------------------------------------------------------
  # 💾 Redis 高速缓存服务
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: geo-go-redis-1
    restart: always
    # 🎯 核心改变：共享主机网络，自动在宿主机本地激活 6379 端口
    network_mode: host  

  # -------------------------------------------------------------
  # 🧭 Valhalla 拓扑导航引擎
  # -------------------------------------------------------------
  valhalla-service:
    image: ghcr.io/valhalla/valhalla:latest
    container_name: valhalla-service
    restart: always
    # 🎯 核心改变：共享主机网络，自动在宿主机本地激活 8002 端口
    network_mode: host  
    volumes:
      - /root/valhalla-server/valhalla.json:/custom_files/valhalla.json:ro
      - /root/valhalla-server/custom_tiles:/custom_files
    command: ["valhalla_service", "/custom_files/valhalla.json", "1"]